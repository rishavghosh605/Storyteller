<header id="top">

  <span class="spacer"></span>
  <span id="sync-badge" class="badge" hidden></span>
  <button id="btn-workshop" class="chip" title="Workshop: bring new pages and pictures"><span data-icon="quill"></span><span class="lbl">Workshop</span></button>
  <button id="btn-images" class="chip" title="Saved pictures"><span data-icon="image"></span><span class="lbl">Pictures</span></button>

<footer id="controls">
  <div class="group story-only">
    <button id="btn-repeat-seq" class="ctl" title="Repeat this part from the beginning"><span data-icon="restart"></span><small>Part again</small></button>
    <button id="btn-repeat" class="ctl" title="Repeat the last sentence (left arrow)"><span data-icon="again"></span><small>Sentence</small></button>
    <button id="btn-play" class="ctl main" title="Tell / pause (space)"><span data-icon="play"></span></button>
    <button id="btn-next" class="ctl" title="And then? Go on (right arrow)"><span data-icon="next"></span><small>And then?</small></button>
    <button id="btn-slow" class="ctl toggle" title="Slower German"><span data-icon="turtle"></span><small>Slow German</small></button>
    <button id="btn-night" class="ctl toggle" title="Bedtime: this part is the last one for tonight"><span data-icon="moon"></span><small>Last one</small></button>
  </div>
  <form id="tea-form" class="group tea-only" autocomplete="off">
    <input id="tea-input" type="text" placeholder="Say it, or write it here for Grandma…" aria-label="Talk to Grandma">
    <button class="ctl" title="Send"><span data-icon="send"></span></button>
    <button type="button" id="btn-jar" class="chip" title="Grandma goes through words you asked about">My words</button>
    <button type="button" id="btn-ask-claude" class="chip" hidden>Copy this question for Claude</button>
  </form>
  <div class="group">
    <button id="btn-room" class="ctl room" title="Switch room"><span data-icon="tea"></span><small id="room-label">Teatime</small></button>
    <button id="btn-mic" class="ctl toggle" title="Microphone: speak to Grandma (M)"><span data-icon="mic"></span><small>Mic</small></button>
    <button id="btn-cloud" class="ctl toggle" title="Speech cloud (C)"><span data-icon="cloud"></span><small>Cloud</small></button>
    <button id="btn-texts" class="ctl toggle" title="Read along (T)"><span data-icon="book"></span><small>Texts</small></button>
    <button id="btn-meanings" class="ctl toggle" title="Tap a word to see its meaning"><span data-icon="aa"></span><small>Meanings</small></button>
  </div>
  <div id="heard" class="heard" hidden></div>
</footer>

<button id="wake" class="wake">
  <span class="wake-card"><b>Grandma is dozing.</b><span>Tap anywhere, press space, or just say hello.</span></span>
</button>

<aside id="texts" class="texts" hidden>
  <header>
    <button id="tx-prev" class="ctl small" title="Earlier part"><span data-icon="left"></span></button>
    <div class="tx-title"><b id="tx-num"></b><span id="tx-name"></span></div>
    <button id="tx-next" class="ctl small" title="Later part"><span data-icon="right"></span></button>
    <span class="spacer"></span>
    <button id="tx-swap" class="chip" title="Swap the two sides"><span data-icon="swap"></span><span class="lbl">Swap</span></button>
    <button id="tx-close" class="ctl small" title="Hide the texts"><span data-icon="close"></span></button>
  </header>
  <div id="tx-body" class="tx-body"></div>
</aside>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true">
    <nav id="tabs" class="tabs">
      <button data-group="journey">My journey</button>
      <button data-group="workshop">Workshop</button>
      <button data-group="settings">Settings</button>
      <span class="spacer"></span>
      <button id="sheet-close" class="ctl small" title="Close"><span data-icon="close"></span></button>
    </nav>
    <nav id="subtabs" class="subtabs"></nav>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</div>

<div id="album" class="album" hidden><div class="album-card"><h2 id="album-title"></h2><div id="album-grid" class="album-grid"></div><p class="album-hint">Tap anywhere, or say “and then?”</p></div></div>
<div id="lightbox" class="lightbox" hidden><img alt=""></div>
<div id="pop" class="pop" hidden></div>
<div id="toast" class="toast" hidden></div>
